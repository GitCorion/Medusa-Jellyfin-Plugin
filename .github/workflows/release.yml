name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        run: |
          dotnet publish src/Jellyfin.Plugin.Catalogo/Jellyfin.Plugin.Catalogo.csproj \
            -c Release -o artifacts/publish
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd artifacts/publish
          zip -j "../catalogo_${VERSION}.zip" Jellyfin.Plugin.Catalogo.dll
          cd ..
          sha256sum "catalogo_${VERSION}.zip" > "catalogo_${VERSION}.sha256"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.sha256
